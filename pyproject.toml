[project]
name = "workforge"
version = "0.1.0"
description = "MCP server + worker system for AI agents: save Python scripts, run them sync/async, stream logs, fetch outputs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "disillusioners / WorkForge contributors" }]
keywords = ["mcp", "fastmcp", "ai-agents", "automation", "scripts", "worker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.0.8",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.scripts]
workforge = "workforge.cli:main"
workforge-db-init = "workforge.cli:db_init_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/workforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
