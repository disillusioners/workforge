# =====================================================================
# GitLab CI — WorkForge  (SHELL-executor edition)
#
# Runner reality (gitlab.yedda.tech, instance-type SHELL executors):
#   * image:/services: are IGNORED on shell runners — jobs execute on
#     the runner host, where neither `uv` nor a dind daemon exists.
#     That mismatch killed pipelines #36/#37 (`uv: command not found`).
#   * Every job therefore orchestrates its own Docker containers via
#     the HOST docker CLI — the exact pattern proven green by
#     yedda-agent-fleet/.gitlab-ci.yml on the same instance (whose
#     header cites itself as the reference). This file mirrors its
#     mechanics:
#       - tests run inside a pinned uv image:
#         docker run --rm -v "$CI_PROJECT_DIR":/workspace -w /workspace
#           -u "$(id -u):$(id -g)"            # host-owned checkout,
#                                             # no root-owned files
#           -e HOME=/workspace/.cache/home    # writable HOME for -u
#           --entrypoint sh "$UV_IMAGE" -c '… export UV_CACHE_DIR=…
#           mkdir -p …; uv sync …; uv run pytest …'
#         (agent-fleet builds a custom docker/Dockerfile.ci-backend
#         because its guard tests need git; WorkForge's tests don't
#         shell out to git, so the public uv image is enough.)
#       - build/push jobs call plain `docker build`/`docker push` on
#         the host (agent-fleet build:images pattern: login via
#         --password-stdin, $CI_COMMIT_SHORT_SHA + latest tags, only
#         on mainline).
#   * A before_script guard fails fast with an install hint when the
#     runner host has no docker CLI.
#
# Conventions kept from the first WorkForge CI (mirrored from
# agent-fleet as well): workflow rules (MR + mainline `latest` + CI
# self-test branches + vX.Y.Z tags), `interruptible: true`, cache keyed
# on uv.lock with the uv cache living under $CI_PROJECT_DIR/.cache/uv
# so the host-side GitLab cache persists it, retry on
# runner_system_failure / stuck_or_timeout_failure, `set -euo pipefail`
# in the publishing job, VERSION/VCS_REF/BUILD_DATE OCI build-args.
#
# Postgres: deliberately NOT provisioned (agent-fleet starts a
# throwaway PG container, but only because ITS tests honor
# TEST_POSTGRES_* overrides). WorkForge's history tests hardcode
# unix-socket peer auth (tests/test_history.py: GOOD_URL =
# postgresql:///workforge_test) and skip cleanly when unreachable — a
# TCP PG container would never be used. Revisit when the suite grows a
# DSN override; then lift agent-fleet's .start_pg anchor verbatim.
#
# Mainline branch is `latest` (agent-fleet naming convention; `main`
# exists but is a stale init stub).
#
# uv pinned to 0.7.0 — the version that generated uv.lock (same pin as
# the Dockerfile builder stage).
# =====================================================================

stages:
  - test
  - build
  - push

workflow:
  rules:
    # MR pipelines
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # mainline
    - if: '$CI_COMMIT_BRANCH == "latest"'
    # self-testing of CI/docker changes (this family of branches only)
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*docker-ci/'
    # version tags → pipeline for the push stage
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

default:
  interruptible: true
  # Shell runners execute on the host: the docker CLI is the one hard
  # dependency of every job below. Fail fast, name the fix.
  before_script:
    - |
      command -v docker >/dev/null 2>&1 || {
        echo "FATAL: runner host lacks the docker CLI — jobs wrap all tooling in containers (shell-executor pattern, see header)." >&2
        echo "FIX: install docker-ce-cli (or the full docker engine) on this runner host, then retry." >&2
        exit 1
      }

variables:
  DOCKER_BUILDKIT: "1"
  UV_IMAGE: "ghcr.io/astral-sh/uv:0.7.0-python3.12-bookworm-slim"

# ---------------------------------------------------------------------
# TEST STAGE — full pytest suite, wrapped in the uv container.
# Mechanics mirror agent-fleet's .run_pytests anchor: repo mounted at
# /workspace, run as the host uid/gid (no root-owned files in the
# checkout or cache), HOME + UV_CACHE_DIR inside the mount so the
# GitLab cache (paths: .cache/uv/) persists across jobs.
# History tests skip gracefully without a runner-host PG.
# ---------------------------------------------------------------------
test:pytest:
  stage: test
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - |
      set -e
      docker run --rm \
        -v "$CI_PROJECT_DIR":/workspace -w /workspace \
        -u "$(id -u):$(id -g)" \
        -e HOME=/workspace/.cache/home \
        --entrypoint sh "$UV_IMAGE" -c '
          set -e
          export UV_CACHE_DIR=/workspace/.cache/uv
          mkdir -p "$HOME" "$UV_CACHE_DIR"
          echo ">>> uv sync (pyproject + uv.lock, dev group for pytest)"
          uv sync --locked
          echo ">>> pytest"
          uv run pytest tests/ -q -p no:cacheprovider
        '

# ---------------------------------------------------------------------
# BUILD STAGE — validation gate: the Dockerfile must build.
# Runs on MRs, CI/docker self-test branches, and version tags — a
# broken Dockerfile must surface at BUILD, not at the registry-
# publishing step. No push (MRs have no registry write target by
# default; mainline is covered by push:image below).
# Host `docker build` (BuildKit via DOCKER_BUILDKIT=1) — no dind.
# ---------------------------------------------------------------------
build:image:
  stage: build
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*docker-ci/'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - docker info
    - docker build
        --build-arg VCS_REF="$CI_COMMIT_SHA"
        --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .

# ---------------------------------------------------------------------
# PUSH STAGE — images published to the GitLab registry.
# Runs only on the mainline branch and version tags (reference
# convention: test branches never push). Predefined $CI_REGISTRY_*
# vars work on shell runners; login via --password-stdin.
#   latest branch → :$CI_COMMIT_SHORT_SHA + :latest
#   vX.Y.Z tag    → :X.Y.Z + :latest
# VERSION build-arg: package version by default, release tag on
# vX.Y.Z pipelines — the image's version label always matches the
# shipped package; VCS_REF/BUILD_DATE carry build provenance.
# ---------------------------------------------------------------------
push:image:
  stage: push
  interruptible: false
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_COMMIT_BRANCH == "latest"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    # set -euo pipefail FIRST: a failed docker push must fail the job —
    # the trailing echo otherwise swallows the exit code (green build,
    # unpublished release). ${CI_COMMIT_TAG:-} because set -u aborts on
    # the unset var on branch pipelines.
    - set -euo pipefail
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        docker build --build-arg VERSION="$VERSION" \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "$CI_REGISTRY_IMAGE:$VERSION" \
          -t "$CI_REGISTRY_IMAGE:latest" .
        docker push "$CI_REGISTRY_IMAGE:$VERSION"
      else
        docker build \
          --build-arg VCS_REF="$CI_COMMIT_SHA" \
          --build-arg BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE:latest" .
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker logout "$CI_REGISTRY"
    - echo "Pushed:"
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then echo "  $CI_REGISTRY_IMAGE:$VERSION (+ latest)"; else echo "  $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA (+ latest)"; fi
