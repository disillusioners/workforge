# =====================================================================
# GitLab CI — WorkForge
#
# Conventions mirrored from yedda-agent-fleet/.gitlab-ci.yml (the
# reference CI this file follows), adapted to WorkForge's reality:
#   * workflow rules: MR pipelines, mainline, and CI/docker self-testing
#     on feature/*docker-ci branches (reference: feature/gitlab-ci)
#   * mainline-only image pushes, tagged $CI_COMMIT_SHORT_SHA + latest
#     with $CI_REGISTRY_IMAGE / $CI_REGISTRY_* auth via
#     `docker login --password-stdin` (reference: build:images)
#   * cache keyed on uv.lock, retry on runner system failures,
#     `interruptible: true` by default
#   * uv pinned to 0.7.0 everywhere — the version that generated
#     uv.lock (same pin as the Dockerfile builder stage)
#
# Differences forced by runner type — the reference repo runs on
# self-hosted SHELL executors, so its jobs orchestrate their own docker
# containers. WorkForge has no GitLab remote/runner yet; this file
# targets GitLab-default DOCKER executors (gitlab.com shared runners):
#   * stages are test → build → push (reference: test → build+push);
#     `build` is the MR validation gate ("Dockerfile must build"),
#     `push` rebuilds in its own dind and publishes (mainline only, so
#     mainline does NOT pay a double build)
#   * test job runs inside an image with uv preinstalled instead of
#     self-orchestrated containers; build/push use docker:27 + dind
#     (needs a privileged runner — gitlab.com shared runners are fine)
#
# Postgres: deliberately NOT declared as a service. The history tests
# (tests/test_history.py) hardcode unix-socket peer auth
# (GOOD_URL = postgresql:///workforge_test) and skip cleanly when
# unreachable — a TCP service container would never be used by them.
# Revisit when the suite grows a TEST_* DSN override.
#
# Mainline branch is `latest` (yedda-agent-fleet naming convention;
# `main` exists but is a stale init stub).
# =====================================================================

stages:
  - test
  - build
  - push

workflow:
  rules:
    # MR pipelines
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # mainline
    - if: '$CI_COMMIT_BRANCH == "latest"'
    # self-testing of CI/docker changes (this family of branches only)
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*docker-ci/'
    # version tags → pipeline for the push stage
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'

default:
  interruptible: true

variables:
  DOCKER_BUILDKIT: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

# ---------------------------------------------------------------------
# TEST STAGE — full pytest suite from source
# ---------------------------------------------------------------------
test:pytest:
  stage: test
  # uv 0.7.0 preinstalled on the same base as the runtime image —
  # matches the Dockerfile's uv pin and pyproject's python floor usage.
  image: ghcr.io/astral-sh/uv:0.7.0-python3.12-bookworm-slim
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv/
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - uv sync --locked          # includes the dev group (pytest)
    - uv run pytest tests/ -q -p no:cacheprovider

# ---------------------------------------------------------------------
# BUILD STAGE — MR validation gate: the Dockerfile must build.
# No push (MRs have no registry write target by default; mainline is
# covered by push:image below).
# ---------------------------------------------------------------------
build:image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""      # dind on localhost; TLS not needed
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH =~ /^feature\/.*docker-ci/'
  script:
    - docker info
    - docker build
        --build-arg VERSION="$CI_COMMIT_SHORT_SHA"
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .

# ---------------------------------------------------------------------
# PUSH STAGE — images published to the GitLab registry.
# Runs only on the mainline branch and version tags (reference
# convention: test branches never push).
#   latest branch → :$CI_COMMIT_SHORT_SHA + :latest
#   vX.Y.Z tag    → :X.Y.Z + :latest
# ---------------------------------------------------------------------
push:image:
  stage: push
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  interruptible: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "latest"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        VERSION="${CI_COMMIT_TAG#v}"
        docker build --build-arg VERSION="$VERSION" \
          -t "$CI_REGISTRY_IMAGE:$VERSION" \
          -t "$CI_REGISTRY_IMAGE:latest" .
        docker push "$CI_REGISTRY_IMAGE:$VERSION"
      else
        docker build --build-arg VERSION="$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE:latest" .
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      fi
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker logout "$CI_REGISTRY"
    - echo "Pushed:"
    - if [ -n "$CI_COMMIT_TAG" ]; then echo "  $CI_REGISTRY_IMAGE:$VERSION (+ latest)"; else echo "  $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA (+ latest)"; fi
